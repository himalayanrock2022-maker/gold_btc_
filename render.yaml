
services:
  - type: web
    name: hima-gold-research
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_PATH
        value: /tmp/hima_signals.sqlite
      - key: BRIDGE_TOKEN
        generateValue: true
      - key: MIN_SCORE
        value: "8"
      - key: SL_ATR
        value: "1.5"
      - key: MAX_SPREAD_ATR
        value: "0.18"
      - key: REQUIRE_NEWS_CHECK
        value: "true"
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: TE_API_KEY
        sync: false
